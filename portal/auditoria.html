<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria — Bessoni &amp; Fortes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/img/bf-mark-navy.png">
<link rel="stylesheet" href="../css/style.css?v=21">
</head>
<body>

<div class="portal-shell">
  <aside class="portal-sidebar">
    <a class="portal-brand" href="../index.html" aria-label="Bessoni & Fortes">
      <img src="../assets/img/logo-wordmark-white.png" alt="Bessoni & Fortes">
    </a>

    <nav class="portal-nav">
      <a class="portal-nav-link" href="admin.html">Painel</a>
      <a class="portal-nav-link" href="clientes.html">Cliente</a>
      <a class="portal-nav-link" href="processos.html">Processos</a>
      <a class="portal-nav-link" href="cadastro-de-cliente.html">Cadastro</a>
      <a class="portal-nav-link" href="usuarios.html">Usuários</a>
      <a class="portal-nav-link is-active" href="auditoria.html">Auditoria</a>
    </nav>

    <div class="portal-sidebar-foot">
      <div class="portal-who">
        <span data-user-nome>—</span>
        <span class="tag">Escritório</span>
      </div>
      <button class="portal-logout" type="button" data-logout>Sair</button>
    </div>
  </aside>

  <div class="portal-content">
    <main class="portal-main">

      <div class="portal-head">
        <h1>Auditoria</h1>
        <p>Histórico de alterações em clientes, processos e determinações — quem mudou o quê e quando. Mostra as 200 alterações mais recentes.</p>
      </div>

      <section class="portal-section">
        <div class="portal-toolbar">
          <div class="field">
            <label for="filtro-tabela">Tabela</label>
            <select id="filtro-tabela">
              <option value="">Todas</option>
              <option value="clientes">Clientes</option>
              <option value="processos">Processos</option>
              <option value="determinacoes">Determinações</option>
            </select>
          </div>
          <div class="field">
            <label for="filtro-usuario">Usuário</label>
            <select id="filtro-usuario"><option value="">Todos</option></select>
          </div>
          <div class="field">
            <label for="busca-campo">Campo</label>
            <input type="text" id="busca-campo" placeholder="Ex: status, valor, prazo...">
          </div>
        </div>

        <div class="table-wrap">
          <table class="portal-table">
            <thead>
              <tr>
                <th>Quando</th>
                <th>Usuário</th>
                <th>Tabela</th>
                <th>Campo</th>
                <th>Valor anterior</th>
                <th>Valor novo</th>
              </tr>
            </thead>
            <tbody data-list="auditoria"><tr class="empty-row"><td colspan="6">Carregando…</td></tr></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="auditoria.js"></script>
</body>
</html>
