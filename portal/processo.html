<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processo — Bessoni &amp; Fortes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/img/bf-mark-navy.png">
<link rel="stylesheet" href="../css/style.css?v=22">
</head>
<body>

<div class="portal-shell">
  <aside class="portal-sidebar">
    <a class="portal-brand" href="../index.html" aria-label="Bessoni & Fortes">
      <img src="../assets/img/logo-wordmark-white.png" alt="Bessoni & Fortes">
    </a>

    <nav class="portal-nav">
      <a class="portal-nav-link" href="admin.html">Painel</a>
      <a class="portal-nav-link is-active" href="clientes.html">Cliente</a>
      <a class="portal-nav-link" href="processos.html">Processos</a>
      <a class="portal-nav-link" href="cadastro-de-cliente.html">Cadastro</a>
      <a class="portal-nav-link" href="usuarios.html">Usuários</a>
      <a class="portal-nav-link" href="auditoria.html">Auditoria</a>
    </nav>

    <div class="portal-sidebar-foot">
      <div class="portal-who">
        <span data-user-nome>—</span>
        <span class="tag">Escritório</span>
      </div>
      <button class="portal-logout" type="button" data-logout>Sair</button>
    </div>
  </aside>

  <div class="portal-content">
    <main class="portal-main">

      <div class="case-header">
        <a class="portal-inline-link back" data-voltar-cliente href="clientes.html">← Voltar ao cliente</a>
        <h1 data-processo-titulo>Carregando…</h1>
        <div class="case-chips" data-processo-chips></div>
        <div class="case-meta" data-processo-meta></div>
      </div>

      <div class="processo-layout">
        <div>
          <!-- DETALHES -->
          <section class="portal-section">
            <h2>Dados do processo</h2>

            <form class="form-grid" id="form-processo" data-form="processo">
              <div class="field">
                <label for="proc-categoria">Categoria</label>
                <select id="proc-categoria" required>
                  <option value="prestacao_contas">Prestação de contas</option>
                  <option value="aije">AIJE</option>
                  <option value="representacao">Representação</option>
                  <option value="registro_candidatura">Registro de candidatura</option>
                  <option value="drap">DRAP</option>
                  <option value="outro">Outro</option>
                </select>
              </div>
              <div class="field">
                <label for="proc-subcategoria">Subcategoria</label>
                <input type="text" id="proc-subcategoria" placeholder="Ex: Anual / Eleitoral">
              </div>
              <div class="field">
                <label for="proc-titulo">Título</label>
                <input type="text" id="proc-titulo" placeholder="Ex: Prestação de contas 2020">
              </div>
              <div class="field">
                <label for="proc-ano">Ano</label>
                <input type="number" id="proc-ano" placeholder="Ex: 2020" min="2000" max="2100">
              </div>
              <div class="field">
                <label for="proc-numero">Nº do processo</label>
                <input type="text" id="proc-numero" required placeholder="Ex: 0000000-00.2020.6.00.0000">
              </div>
              <div class="field">
                <label for="proc-orgaojulgador">Órgão julgador</label>
                <input type="text" id="proc-orgaojulgador" placeholder="Ex: TSE ou TRE-BA">
              </div>
              <div class="field">
                <label for="proc-foro">Foro</label>
                <input type="text" id="proc-foro" placeholder="Opcional">
              </div>
              <div class="field">
                <label for="proc-status">Status</label>
                <select id="proc-status">
                  <option value="em_andamento">Em andamento</option>
                  <option value="aguardando_diligencia">Aguardando diligência</option>
                  <option value="concluido">Concluído</option>
                </select>
              </div>
              <div class="field" data-resultado-select-wrap>
                <label for="proc-resultado-select">Resultado</label>
                <select id="proc-resultado-select">
                  <option value="">— sem resultado ainda —</option>
                  <option value="aprovadas">Aprovadas</option>
                  <option value="aprovadas_com_ressalvas">Aprovadas com ressalvas</option>
                  <option value="desaprovadas">Desaprovadas</option>
                  <option value="nao_prestadas">Não prestadas</option>
                </select>
              </div>
              <div class="field" data-resultado-texto-wrap hidden>
                <label for="proc-resultado-texto">Resultado</label>
                <input type="text" id="proc-resultado-texto" placeholder="Ex: Deferido / Indeferido / Procedente...">
              </div>
              <div class="field">
                <label for="proc-data-protocolo">Data de protocolo</label>
                <input type="date" id="proc-data-protocolo">
              </div>
              <div class="field" data-campo-contas hidden>
                <label for="proc-houve-recurso">Houve recurso?</label>
                <select id="proc-houve-recurso">
                  <option value="">— não informado —</option>
                  <option value="true">Sim</option>
                  <option value="false">Não</option>
                </select>
              </div>
              <div class="field" data-campo-contas hidden>
                <label for="proc-transito-julgado">Trânsito em julgado?</label>
                <select id="proc-transito-julgado">
                  <option value="">— não informado —</option>
                  <option value="true">Sim</option>
                  <option value="false">Não</option>
                </select>
              </div>
              <div class="field" data-campo-contas hidden>
                <label for="proc-data-transito">Data do trânsito em julgado</label>
                <input type="date" id="proc-data-transito">
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <label for="proc-observacoes">Observações</label>
                <input type="text" id="proc-observacoes" placeholder="Opcional">
              </div>
              <div class="field">
                <label for="proc-responsavel">Advogado responsável</label>
                <select id="proc-responsavel"><option value="">— não atribuído —</option></select>
              </div>
            </form>
            <div class="portal-form-actions">
              <button class="btn btn-ghost-light" type="submit" form="form-processo">Salvar alterações</button>
              <span class="portal-inline-msg" data-msg="processo"></span>
            </div>
          </section>

          <div class="portal-form-actions" style="justify-content: flex-end; margin-top: 1.4rem;">
            <button class="btn btn-danger" type="button" data-excluir-processo>Excluir processo</button>
            <span class="portal-inline-msg" data-msg="excluir-processo"></span>
          </div>
        </div>

        <aside>
          <div class="sidebar-card">
            <h3>Determinações</h3>
            <div data-determinacoes-resumo><span class="empty-note">Carregando…</span></div>
          </div>

          <div class="sidebar-card">
            <h3 data-determinacao-form-titulo>Nova determinação</h3>
            <form id="form-determinacao" data-form="determinacao">
              <div class="field" style="margin-top:0;">
                <label for="determinacao-tipo">Tipo</label>
                <select id="determinacao-tipo" required>
                  <option value="recolhimento_uniao">Recolhimento à União</option>
                  <option value="aplicacao_politica_mulher">Aplicação em política da mulher</option>
                  <option value="aplicacao_minorias">Aplicação em ações afirmativas / minorias</option>
                  <option value="multa">Multa</option>
                  <option value="outra">Outra</option>
                </select>
              </div>
              <div class="field">
                <label for="determinacao-descricao">Descrição</label>
                <input type="text" id="determinacao-descricao" required placeholder="Ex: Aplicar em política da mulher">
              </div>
              <div class="field">
                <label for="determinacao-valor">Valor (R$)</label>
                <input type="number" id="determinacao-valor" step="0.01" min="0" placeholder="Opcional">
              </div>
              <div class="field">
                <label for="determinacao-exercicio-cumprimento">Exercício de cumprimento</label>
                <input type="number" id="determinacao-exercicio-cumprimento" min="2000" max="2100" placeholder="Ex: 2021">
              </div>
              <div class="field">
                <label for="determinacao-prazo">Prazo</label>
                <input type="date" id="determinacao-prazo">
              </div>
              <div class="field">
                <label for="determinacao-responsavel">Responsável pelo cumprimento</label>
                <select id="determinacao-responsavel"><option value="">— não atribuído —</option></select>
              </div>
              <div class="field">
                <label for="determinacao-data-transito">Data do trânsito em julgado</label>
                <input type="date" id="determinacao-data-transito">
              </div>
              <div class="field">
                <label for="determinacao-status">Status</label>
                <select id="determinacao-status">
                  <option value="pendente">Pendente</option>
                  <option value="cumprida">Cumprida</option>
                </select>
              </div>
              <div class="field" data-campo-cumprimento hidden>
                <label for="determinacao-data-cumprimento">Data do cumprimento</label>
                <input type="date" id="determinacao-data-cumprimento">
              </div>
              <div class="field">
                <label for="determinacao-observacoes">Observações</label>
                <input type="text" id="determinacao-observacoes" placeholder="Opcional">
              </div>
              <div class="portal-form-actions">
                <button class="btn btn-ghost-light" type="submit" form="form-determinacao" data-determinacao-form-botao>Salvar determinação</button>
                <button class="portal-inline-link" type="button" data-cancelar-edicao-determinacao hidden>Cancelar edição</button>
              </div>
              <span class="portal-inline-msg" data-msg="determinacao"></span>
            </form>
          </div>

          <div class="sidebar-card">
            <h3>Documentos</h3>
            <div data-documentos-lista><span class="empty-note">Carregando…</span></div>
            <form id="form-documento" data-form="documento" style="margin-top: 1rem;">
              <div class="field" style="margin-top:0;">
                <label for="documento-arquivo">Arquivo</label>
                <input type="file" id="documento-arquivo">
              </div>
              <div class="field">
                <label for="documento-determinacao">Vincular a uma determinação (opcional)</label>
                <select id="documento-determinacao"><option value="">— documento geral do processo —</option></select>
              </div>
              <div class="portal-form-actions">
                <button class="btn btn-ghost-light" type="submit" form="form-documento">Enviar arquivo</button>
              </div>
              <span class="portal-inline-msg" data-msg="documento"></span>
            </form>
          </div>
        </aside>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/cliente-form.js"></script>
<script src="processo.js"></script>
</body>
</html>
